openapi: 3.0.3
info:
  title: BotiBankAPI
  description: >-
    API REST para operaciones bancarias completas, gestión de clientes, cuentas,
    servicios e hipotecas.
  version: 1.2.0
servers:
  - url: http://localhost:8000/api/v1
    description: Servidor Local
security:
  - default: []
tags:
  - name: Clientes
    description: Gestión de clientes del banco (alta, baja, listado)
  - name: Cuentas
    description: >-
      Alta/baja de cuentas y operaciones (transferencias, movimientos, ingresos,
      retiros)
  - name: Servicios
    description: Gestión y pago de servicios adheridos (luz, agua, gas)
  - name: Hipotecas
    description: Gestión, consulta y pago de créditos hipotecarios
paths:
  /clientes:
    get:
      tags:
        - Clientes
      summary: Listar todos los clientes
      responses:
        '200':
          description: Lista de clientes recuperada con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-mediation-script: >-
        var accept = mc.getProperty('AcceptHeader');

        var responseCode = mc.getProperty('query.param.responseCode');

        var responseCodeSC;

        var responses = [];


        if (!responses[200]) {
         responses [200] = [];
        }

        responses[200]["application/json"] = [ {
          "id" : "76543210A",
          "nombre" : "Ana",
          "apellido" : "García"
        } ];


        responses[501] = [];

        responses[501]["application/json"] = {

        "code" : 501,

        "description" : "Not Implemented"}

        responses[501]["application/xml"] =
        <response><code>501</code><description>Not
        Implemented</description></response>;


        if (responseCode == null) {
         responseCode = 200;
        }


        if (!responses[responseCode]) {
          if (responses["default"]) {
            responseCode = "default"
          } else {
            responseCode = 501;
          }
        }

        if (responseCode === "default") {
          responseCodeSC = mc.getProperty('query.param.responseCode');
        } else {
          responseCodeSC = responseCode;
        }

        if (accept == null || !responses[responseCode][accept]) {
         accept = "application/json"; // assign whatever available
        }


        if (accept == "application/json") {
         mc.setProperty('CONTENT_TYPE', 'application/json');
         mc.setProperty('HTTP_SC', responseCodeSC + "");
         mc.setPayloadJSON(responses[responseCode]["application/json"]);
        }
      x-wso2-application-security:
        security-types:
          - oauth2
        optional: false
    post:
      tags:
        - Clientes
      summary: Agregar un cliente nuevo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cliente'
        required: true
      responses:
        '201':
          description: Cliente creado con éxito
      security:
        - default: []
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
      x-mediation-script: >-
        var accept = mc.getProperty('AcceptHeader');

