components:
  schemas:
    Cliente:
      required:
        - apellido
        - id
        - nombre
      type: object
      properties:
        id:
          type: string
          example: 76543210A
        nombre:
          type: string
          example: Ana
        apellido:
          type: string
          example: García
    Cuenta:
      type: object
      properties:
        cuentaId:
          type: string
          example: '1234567890'
        clienteId:
          type: string
          example: 76543210A
        saldo:
          type: number
          format: float
          example: 1500.5
    CuentaRequest:
      required:
        - clienteId
        - cuentaId
      type: object
      properties:
        cuentaId:
          type: string
          example: '1234567890'
        clienteId:
          type: string
          example: 76543210A
    MontoRequest:
      required:
        - monto
      type: object
      properties:
        monto:
          type: number
          format: float
          example: 1500.5
    TransferenciaRequest:
      required:
        - cuentaDestino
        - monto
      type: object
      properties:
        cuentaDestino:
          type: string
          example: '0987654321'
        monto:
          type: number
          format: float
          example: 500
        concepto:
          type: string
          example: Pago alquiler
    Movimiento:
      type: object
      properties:
        id:
          type: string
        fecha:
          type: string
          format: date-time
        tipo:
          type: string
          enum:
            - INGRESO
            - RETIRO
            - TRANSFERENCIA_ENVIADA
            - TRANSFERENCIA_RECIBIDA
            - PAGO_SERVICIO
            - PAGO_HIPOTECA
            - DESEMBOLSO_HIPOTECA
        monto:
          type: number
          format: float
        descripcion:
          type: string
    Servicio:
      required:
        - codigoServicio
        - monto
        - nombre
        - vencimiento
      type: object
      properties:
        codigoServicio:
          type: string
          example: ELESUR-1234
        nombre:
          type: string
          example: Luz
        monto:
          type: number
          format: float
          example: 45.2
        vencimiento:
          type: string
          format: date
          example: '2026-06-15'
    PagoServicioRequest:
      required:
        - codigoServicio
        - cuentaOrigen
        - monto
      type: object
      properties:
        cuentaOrigen:
          type: string
          example: '1234567890'
        codigoServicio:
          type: string
        monto:
          type: number
          format: float
    Hipoteca:
      type: object
      properties:
        id:
          type: string
          description: ID único de la hipoteca
          example: HIP-001
        clienteId:
          type: string
          example: 76543210A
        montoTotal:
          type: number
          description: Monto original otorgado
          format: float
        balancePendiente:
          type: number
          description: Deuda restante a pagar
          format: float
        vencimiento:
          type: string
          description: Fecha límite del próximo pago o fin del crédito
          format: date
        pagoParcial:
          type: number
          description: Monto de la cuota periódica
          format: float
    CrearHipotecaRequest:
      required:
        - clienteId
        - id
        - monto
        - pagoParcial
        - vencimiento
      type: object
      properties:
        id:
          type: string
          example: HIP-001
        clienteId:
          type: string
          example: 76543210A
        monto:
          type: number
          format: float
          example: 150000
        vencimiento:
          type: string
          format: date
          example: '2050-01-01'
        pagoParcial:
          type: number
          format: float
          example: 850.5
    PagoHipotecaRequest:
      required:
        - cuentaOrigen
        - monto
      type: object
      properties:
        cuentaOrigen:
          type: string
          description: Cuenta de donde se debitará el dinero
          example: '1234567890'
        monto:
          type: number
          description: Monto del pago parcial
          format: float
          example: 850.5
  securitySchemes:
    default:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://test.com
          scopes: {}
